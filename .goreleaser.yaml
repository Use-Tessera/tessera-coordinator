version: 2

project_name: tessera-coordinator

builds:
  - main: ./cmd/tessera-coordinator
    binary: tessera-coordinator
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, api/openapi.yaml, examples/coordinator.toml]

checksum:
  name_template: SHA256SUMS

changelog:
  use: github
  sort: asc
